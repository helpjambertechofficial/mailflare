name: Sync from Upstream & Deploy

on:
  schedule:
    - cron: '0 3 * * *'   # Daily at 3am UTC
  workflow_dispatch:        # Manual trigger bhi chalega

jobs:
  sync:
    name: Sync upstream hieunc229/mailflare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "mailflare-sync"
          git config user.email "mailflare-sync@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/hieunc229/mailflare.git || true
          git fetch --no-tags upstream main

      - name: Check if upstream has new commits
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          LOCAL_SHA=$(git rev-parse HEAD)
          echo "upstream=$UPSTREAM_SHA  local=$LOCAL_SHA"
          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream changes
        id: sync
        if: steps.check.outputs.already_synced == 'false'
        run: |
          git merge upstream/main --no-edit -X theirs || {
            git checkout --theirs .
            git add .
            git commit -m "Sync: resolve conflicts from upstream"
          }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Apply license patch (AGPL v3 - self-hosted)
        if: steps.sync.outputs.changed == 'true'
        run: |
          LICENSE_FILE="src/lib/licenses/service.ts"
          if [ -f "$LICENSE_FILE" ]; then
            # Inject bypass at top of getLicenseEntitlements function
            cat > /tmp/license_patch.py << 'ENDPY'
import pathlib, re

path = pathlib.Path("src/lib/licenses/service.ts")
content = path.read_text(encoding="utf-8")

ENTITLEMENTS_BYPASS = '''export async function getLicenseEntitlements(_env: CloudflareEnv): Promise<LicenseEntitlements> {
\t// Self-hosted: all features unlocked (AGPL v3 - source: github.com/helpjambertechofficial/mailflare)
\treturn {
\t\tplan: "team",
\t\tcanCustomizeBranding: true,
\t\tcanManageAccounts: true,
\t\tcanShareMailboxes: true,
\t\taccountSeatLimit: null,
\t\tcanForwardEmail: true,
\t};
}'''

STATUS_BYPASS = '''export async function getLicenseStatus(env: CloudflareEnv): Promise<LicenseStatus> {
\t// Self-hosted: all features unlocked (AGPL v3 - source: github.com/helpjambertechofficial/mailflare)
\tconst base = await getOrCreateLicenseSettings(env);
\treturn {
\t\tplan: "team",
\t\tstate: "active",
\t\tfeatures: ["branding", "accounts", "shared_mailboxes", "email_forwarding"],
\t\tseatLimit: null,
\t\tinstanceId: base.instanceId,
\t\tinstanceUrl: base.instanceUrl,
\t\tactive: true,
\t\tactivatedAt: base.activatedAt ?? new Date(),
\t\tvalidatedAt: base.validatedAt ?? new Date(),
\t};
}'''

patched = re.sub(
    r'export async function getLicenseEntitlements\(env.*?(?=\nexport |\Z)',
    ENTITLEMENTS_BYPASS + '\n\n',
    content, flags=re.DOTALL
)
patched = re.sub(
    r'export async function getLicenseStatus\(env.*?(?=\nexport |\Z)',
    STATUS_BYPASS + '\n\n',
    patched, flags=re.DOTALL
)

if patched != content:
    path.write_text(patched, encoding="utf-8")
    print("License patch applied.")
else:
    print("Already patched or pattern changed - manual review needed.")
ENDPY
            python3 /tmp/license_patch.py
          fi

      - name: Commit and push sync + patch
        if: steps.sync.outputs.changed == 'true'
        run: |
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: sync upstream + apply self-hosted license patch"
          git push origin main

      - name: No upstream changes
        if: steps.check.outputs.already_synced == 'true'
        run: echo "Fork is already up to date. No deploy needed."

  deploy:
    name: Deploy to Cloudflare Workers
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout updated fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
