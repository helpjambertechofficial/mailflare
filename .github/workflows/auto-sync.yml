name: Sync from Upstream & Deploy

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync upstream hieunc229/mailflare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.result.outputs.changed }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "mailflare-sync"
          git config user.email "mailflare-sync@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/hieunc229/mailflare.git || true
          git fetch --no-tags upstream main

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          LOCAL_SHA=$(git rev-parse HEAD)
          echo "upstream=$UPSTREAM_SHA  local=$LOCAL_SHA"
          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git merge upstream/main --no-edit -X theirs || {
            git checkout --theirs -- .
            git add .
            git commit -m "sync: resolve conflicts from upstream hieunc229/mailflare"
          }

      - name: Apply license patch
        if: steps.check.outputs.has_changes == 'true'
        run: python3 scripts/patch-license.py

      - name: Commit and push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git add -A
          git diff --cached --quiet && echo "Nothing to commit after patch" || git commit -m "chore: sync upstream + self-hosted license patch (AGPL v3)"
          git push origin main

      - name: Set output
        id: result
        run: |
          echo "changed=${{ steps.check.outputs.has_changes }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Cloudflare Workers
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
