name: Sync from Upstream & Deploy

on:
  schedule:
    - cron: '0 3 * * *'   # Daily at 3am UTC
  workflow_dispatch:        # Manual trigger bhi chalega

jobs:
  sync:
    name: Sync upstream hieunc229/mailflare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "mailflare-sync"
          git config user.email "mailflare-sync@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/hieunc229/mailflare.git || true
          git fetch --no-tags upstream main

      - name: Check if upstream has new commits
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          LOCAL_SHA=$(git rev-parse HEAD)
          echo "upstream=$UPSTREAM_SHA"
          echo "local=$LOCAL_SHA"
          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "already_synced=true" >> $GITHUB_OUTPUT
          else
            echo "already_synced=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        id: sync
        if: steps.check.outputs.already_synced == 'false'
        run: |
          # Merge upstream, preferring upstream for conflicts (we patch after)
          git merge upstream/main --no-edit -X theirs || {
            echo "Merge had conflicts, using upstream version"
            git checkout --theirs .
            git add .
            git commit -m "Sync: resolve conflicts from upstream hieunc229/mailflare"
          }

          # ---- License patch (AGPL v3 — source public on GitHub) ----
          # Ensure getLicenseEntitlements always returns full Team entitlements
          LICENSE_SERVICE="src/lib/licenses/service.ts"
          if [ -f "$LICENSE_SERVICE" ]; then
            # Insert bypass after the getLicenseStatus function signature if it was overwritten
            python3 - <<'PYEOF'
import re, pathlib

path = pathlib.Path("src/lib/licenses/service.ts")
content = path.read_text(encoding="utf-8")

# Patch getLicenseEntitlements to always return full team entitlements
entitlements_patch = '''export async function getLicenseEntitlements(_env: CloudflareEnv): Promise<LicenseEntitlements> {
\t// Self-hosted instance: all features unlocked (AGPL v3 — source is public at github.com/helpjambertechofficial/mailflare)
\treturn {
\t\tplan: "team",
\t\tcanCustomizeBranding: true,
\t\tcanManageAccounts: true,
\t\tcanShareMailboxes: true,
\t\taccountSeatLimit: null,
\t\tcanForwardEmail: true,
\t};
}'''

# Replace getLicenseEntitlements function entirely
pattern = r'export async function getLicenseEntitlements\(env[^}]+?(?:\}\s*\})\s*\}'
content_new = re.sub(pattern, entitlements_patch, content, flags=re.DOTALL)

# Patch getLicenseStatus to always return active team
status_patch = '''export async function getLicenseStatus(env: CloudflareEnv): Promise<LicenseStatus> {
\t// Self-hosted instance: all features unlocked (AGPL v3 — source is public at github.com/helpjambertechofficial/mailflare)
\tconst base = await getOrCreateLicenseSettings(env);
\treturn {
\t\tplan: "team",
\t\tstate: "active",
\t\tfeatures: ["branding", "accounts", "shared_mailboxes", "email_forwarding"],
\t\tseatLimit: null,
\t\tinstanceId: base.instanceId,
\t\tinstanceUrl: base.instanceUrl,
\t\tactive: true,
\t\tactivatedAt: base.activatedAt ?? new Date(),
\t\tvalidatedAt: base.validatedAt ?? new Date(),
\t};
}'''

pattern2 = r'export async function getLicenseStatus\(env[^}]+?\}'
content_new2 = re.sub(pattern2, status_patch, content_new, flags=re.DOTALL)

if content_new2 != content:
    path.write_text(content_new2, encoding="utf-8")
    print("License patch applied successfully")
else:
    print("License patch already applied or pattern not found")
PYEOF
          fi
          # ---- End license patch ----

          git add -A
          git diff --cached --quiet && echo "No changes after patch" || git commit -m "Patch: unlock all features for self-hosted instance (AGPL v3)"

          git push origin main
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Already up to date
        if: steps.check.outputs.already_synced == 'true'
        run: |
          echo "Fork is already up to date with upstream. No deploy needed."
          echo "changed=false" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Cloudflare Workers
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout updated fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
